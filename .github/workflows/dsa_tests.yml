name: DSA Tests

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          set -e

          mkdir -p bin

          for source in tests/*.c; do
            name="$(basename "$source" .c)"
            echo "::group::$name"
            echo "Building $name..."

            if ! gcc -Wall -Wextra -std=gnu2x -g -O1 \
              -fsanitize=address,undefined \
              -fno-omit-frame-pointer \
              -I. "$source" -lm -o "bin/$name"; then
              echo "BUILD FAILED: $name"
              echo "::endgroup::"
              exit 1
            fi

            echo "Running $name..."
            if ! "./bin/$name"; then
              echo "TEST FAILED: $name"
              echo "::endgroup::"
              exit 1
            fi

            echo "PASSED: $name"
            echo "::endgroup::"
          done
